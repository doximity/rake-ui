---

version: 2.1

executors:
  ruby:
    parameters:
      version:
        type: string
    resource_class: small
    docker:
      - image: cimg/ruby:<< parameters.version >>
        environment:
          BUNDLE_VERSION: "2.4.3"

# yaml anchor filters
master_only: &master_only
  filters:
    branches:
      only: master
    tags:
      ignore: /.*/
pr_only: &pr_only
  filters:
    branches:
      ignore: master
    tags:
      ignore: /.*/
version_tags_only: &version_tags_only
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v.*/

jobs:
  build:
    parameters:
      ruby_version:
        type: string
    executor:
      name: ruby
      version: << parameters.ruby_version >>
    steps:
      - checkout
      - run:
          name: Install Bundler specific version
          command: |
            gem install bundler --version "${BUNDLE_VERSION}" --force
            bundle config set --local path 'vendor/bundle'
            bundle config set --local frozen 'true'
            bundle config set --local jobs '4'
            bundle config set --local retry '3'
      - run:
          name: Install Ruby Dependencies
          command: bundle install --local --jobs=4 --retry=3
      - run:
          name: Run Tests
          command: bundle exec rake test
      - store_test_results:
          name: Store test results
          path: tmp/test-results
      - run:
          name: Run StandardRB
          command: bundle exec standardrb
      - store_artifacts:
          name: Saves documentation
          path: doc
      - persist_to_workspace:
          root: .
          paths:
            - vendor/bundle

workflows:
  version: 2

  pull-requests:
    jobs:
      - build:
          <<: *pr_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]

  trunk:
    jobs:
      - build:
          <<: *master_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]

  final-release:
    jobs:
      - build:
          <<: *version_tags_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]
